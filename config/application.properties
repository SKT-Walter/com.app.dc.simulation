serverKey=SERVER.SIMSvr

apsServerKey=SERVER.APSSvr
quantServerKey=SERVER.QuantSvr
textList=15m|30m|1h|4h|1d
symbolList=ETHUSDT|BTCUSDT|SOLUSDT
queryKlineCount=200
queryKlineCount1d=400

log4j.file=./config/log4j.ini
log4j.thread=1
log4j.writeTime=true
log4j.async=true

storePath=./data/SIMSvr

dbpool.cfg=./config/DBPoolConfig.ini
dbType=rockdb
clickhouse.default=ClickHouse1

# Local backtest
backtest.localDataDir=./config/data
binanceBacktestReportEnabled=true
binanceBacktestReportDir=./src/docs/backtest
binanceBacktestReportMaxTrades=120
backtest.dynamic.catalogFile=./config/dynamic_strategy_catalog.json
backtest.regime.minimumBars=60
backtest.regime.adxThreshold=25
backtest.regime.slopeThreshold=0.0015
backtest.regime.minimumConfidence=0.55
backtest.routing.confirmationBars=3
backtest.routing.minimumHoldBars=4
backtest.routing.switchMargin=5
backtest.routing.retentionScoreDelta=10
backtest.routing.lowScoreConfirmationBars=3

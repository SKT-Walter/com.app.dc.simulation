serverKey=SERVER.SIMSvr

apsServerKey=SERVER.APSSvr
quantServerKey=SERVER.QuantSvr
textList=15m|30m|1h|4h|1d
symbolList=ETHUSDT|BTCUSDT|SOLUSDT
queryKlineCount=200
queryKlineCount1d=400

log4j.file=./config/log4j.ini
log4j.thread=1
log4j.writeTime=true
log4j.async=true

storePath=./data/SIMSvr

dbpool.cfg=./config/DBPoolConfig.ini
dbType=rockdb
clickhouse.default=ClickHouse1

# Local backtest
backtest.localDataDir=./config/data
binanceBacktestReportEnabled=true
binanceBacktestReportDir=./src/docs/backtest
strategy.catalog.file=./config/dynamic_strategy_catalog.json
strategy.profile.dir=./config/strategy-profiles
strategy.regime.minimumBars=60
strategy.regime.adxThreshold=25
strategy.regime.slopeThreshold=0.0015
strategy.regime.minimumConfidence=0.55
strategy.routing.confirmationBars=3
strategy.routing.minimumHoldBars=4
strategy.routing.switchMargin=5
strategy.routing.retentionScoreDelta=10
strategy.routing.lowScoreConfirmationBars=3
strategy.routing.breakoutConfirmationBars=1
strategy.trend-compression.preparation-bars=3
strategy.trend-compression.armed-validity-bars=16
strategy.trend-compression.minimum-volume-ratio=0.80
strategy.trend-compression.minimum-breakout-atr=0.05
strategy.trend-compression.minimum-body-atr=0.20
strategy.trend-compression.retest-validity-bars=4
strategy.trend-compression.maximum-retest-atr=0.50
# binanceTrend keeps 15m counter-structure entries. Only those entries receive the
# tighter ATR stop; close-based exits require MA plus Regime/structure consensus.
strategy.binance-trend.initial-stop-atr-multiplier=2.0
strategy.binance-trend.minimum-initial-stop-pct=0.03
strategy.binance-trend.maximum-initial-stop-pct=0.04
strategy.binance-trend.regime-exit-confirmation-bars=3
strategy.binance-trend.structural-exit-confirmation-bars=3
strategy.binance-trend.structural-exit-minimum-confidence=0.60
strategy.binance-trend.structural-confidence-increase-epsilon=0.005
# Slow structural trend calculated from closed 15m bars. It never filters the baseline router.
strategy.structural-trend.enabled=true
strategy.structural-trend.minimumBars=672
strategy.structural-trend.fastEmaBars=192
strategy.structural-trend.slowEmaBars=672
strategy.structural-trend.slopeLookbackBars=96
strategy.structural-trend.structureLookbackBars=192
strategy.structural-trend.confirmationBars=16
strategy.structural-trend.reversalConfirmationBars=32
strategy.structural-trend.pullbackToleranceBars=192
strategy.structural-trend.minimumConfidence=0.60
strategy.structural-trend.fullSpreadPct=0.04
strategy.structural-trend.fullSlopePct=0.01

# Slow structure is context only: it may nudge a legal candidate's score,
# but cannot reject candidates, publish signals or open positions itself.
strategy.structural-score.enabled=true
strategy.structural-score.trend-alignment-bonus=2
strategy.structural-score.trend-conflict-penalty=3
strategy.structural-score.breakout-alignment-bonus=1.5
strategy.structural-score.breakout-conflict-penalty=2.5
strategy.structural-score.mean-reversion-alignment-bonus=0.5
strategy.structural-score.mean-reversion-conflict-penalty=1
strategy.structural-score.pullback-factor=0.5
strategy.sol-bull-launch.pullback-recovery-enabled=false
strategy.sol-ema-pullback.mtf-admission-enabled=false
strategy.sol-ema-pullback.require-positive-one-hour-slope=false
strategy.sol-ema-pullback.require-bull-structure=false
strategy.sol-bull-launch.minimum-4h-ema-separation-atr=-0.5
strategy.sol-bull-launch.minimum-4h-close-above-ema60-atr=0.5
strategy.sol-bull-launch.minimum-4h-roc3-pct=1.0

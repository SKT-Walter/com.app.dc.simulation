serverKey=SERVER.SIMSvr

apsServerKey=SERVER.APSSvr
quantServerKey=SERVER.QuantSvr
textList=15m|30m|1h|4h|1d
symbolList=ETHUSDT|BTCUSDT|SOLUSDT
queryKlineCount=200
queryKlineCount1d=400

log4j.file=./config/log4j.ini
log4j.thread=1
log4j.writeTime=true
log4j.async=true

storePath=./data/SIMSvr

dbpool.cfg=./config/DBPoolConfig.ini
dbType=rockdb
clickhouse.default=ClickHouse1

# Local backtest
backtest.localDataDir=./config/data
binanceBacktestReportEnabled=true
binanceBacktestReportDir=./src/docs/backtest
backtest.dynamic.catalogFile=./config/dynamic_strategy_catalog.json
backtest.regime.minimumBars=60
backtest.regime.adxThreshold=25
backtest.regime.slopeThreshold=0.0015
backtest.regime.minimumConfidence=0.55
backtest.routing.confirmationBars=3
backtest.routing.minimumHoldBars=4
backtest.routing.switchMargin=5
backtest.routing.retentionScoreDelta=10
backtest.routing.lowScoreConfirmationBars=3
# Slow structural trend calculated from closed 15m bars. It never filters the baseline router.
backtest.structural-trend.enabled=true
backtest.structural-trend.minimumBars=672
backtest.structural-trend.fastEmaBars=192
backtest.structural-trend.slowEmaBars=672
backtest.structural-trend.slopeLookbackBars=96
backtest.structural-trend.structureLookbackBars=192
backtest.structural-trend.confirmationBars=16
backtest.structural-trend.reversalConfirmationBars=32
backtest.structural-trend.pullbackToleranceBars=192
backtest.structural-trend.minimumConfidence=0.60
backtest.structural-trend.fullSpreadPct=0.04
backtest.structural-trend.fullSlopePct=0.01

# Slow structure is context only: it may nudge a legal candidate's score,
# but cannot reject candidates, publish signals or open positions itself.
backtest.structural-score.enabled=true
backtest.structural-score.trend-alignment-bonus=2
backtest.structural-score.trend-conflict-penalty=3
backtest.structural-score.breakout-alignment-bonus=1.5
backtest.structural-score.breakout-conflict-penalty=2.5
backtest.structural-score.mean-reversion-alignment-bonus=0.5
backtest.structural-score.mean-reversion-conflict-penalty=1
backtest.structural-score.pullback-factor=0.5

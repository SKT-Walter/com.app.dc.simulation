serverKey=SERVER.SIMSvr

apsServerKey=SERVER.APSSvr
quantServerKey=SERVER.QuantSvr
textList=15m|30m|1h|4h|1d
symbolList=ETHUSDT|BTCUSDT|SOLUSDT
queryKlineCount=200
queryKlineCount1d=400

log4j.file=./config/log4j.ini
log4j.thread=1
log4j.writeTime=true
log4j.async=true

storePath=../../data/SIMSvr

dbpool.cfg=../../control/DBPoolConfig.ini
dbType=clickhouse
clickhouse.default=ClickHouse1

strategy.backtest.task.enabled=true
strategy.backtest.parallelism=3
strategy.backtest.task.batchSize=10
strategy.backtest.task.cron=0 */1 * * * ?
strategy.backtest.threadNamePrefix=strategy-backtest-
strategy.backtest.kline-autofill.enabled=true
strategy.backtest.kline-autofill.parallelism=2
strategy.backtest.kline-autofill.queueCapacity=100
strategy.backtest.kline-autofill.threadNamePrefix=strategy-kline-autofill-
strategy.backtest.kline-autofill.yearsBack=2
strategy.backtest.kline-autofill.venue=BNFutures
strategy.backtest.kline-autofill.mode=gap-fill
strategy.backtest.kline-autofill.limitPerCall=1500
strategy.backtest.kline-autofill.sleepMs=250
strategy.backtest.kline-autofill.minStartIntervalMs=3000
binanceBacktestReportDir=../../data/SIMSvr/reports
